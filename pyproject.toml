[tool.pytest.ini_options]
# scripts/ is a flat directory of sibling-importing modules ("import schema",
# "import dcf_fields as F"), not a package. Putting it on pythonpath
# reproduces the environment the scripts run under, so tests import the
# modules exactly as production does.
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: touches the live research/ corpus"]

[tool.ruff]
target-version = "py312"
# Lint the code, not the research corpus.
include = ["scripts/**/*.py", "tests/**/*.py", "evals/**/*.py", ".claude/skills/**/*.py"]

[tool.ruff.lint]
# Explicit select pins the gate: ruff's own default set is broad and shifts
# across versions, and this gate must only move by deliberate commit.
select = [
    "F",               # pyflakes: unused imports/vars, undefined names
    "E4", "E7", "E9",  # pycodestyle errors
    "I",               # import sorting
    "B",               # bugbear: likely bugs & design smells
    "C4",              # comprehension cleanups
    "SIM",             # simplifiable code
    "UP",              # outdated syntax for py312
    "PIE",             # misc smells
    "ISC",             # implicit string concatenation
    "PLW",             # pylint warnings (incl. subprocess-run-without-check)
    "RUF",             # ruff-native (unused-noqa, mutable class defaults, ...)
    "EXE",             # shebang/executable-bit mismatches
]
# The parsers match curly quotes and en-dashes exactly as pdftotext emits
# them from real filings; "fixing" those to ASCII would break matching.
ignore = ["RUF001", "RUF002", "RUF003"]
# Not selected on purpose: BLE (broad excepts are policy in the scraping
# pipeline) and DTZ (naive datetimes are fine in a single-timezone tool).
