[tool.pytest.ini_options]
# scripts/ is a flat directory of sibling-importing modules ("import schema",
# "import dcf_fields as F"), not a package. Putting it on pythonpath
# reproduces the environment the scripts run under, so tests import the
# modules exactly as production does.
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: touches the live research/ corpus"]
