# Lint + test gate. Keep the ruff pin in sync with the Makefile's `lint`
# target; the rule set itself lives in pyproject.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: pipx run ruff==0.16.1 check .
      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh
      - name: Tests
        run: |
          pip install pytest duckdb
          python -m pytest
